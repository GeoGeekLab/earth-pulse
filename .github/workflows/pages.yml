name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify entrypoint contract
        run: |
          set -euo pipefail
          sha="$(jq -r '.source_commit' SOURCE.json)"
          test "$(jq -r '.role' SOURCE.json)" = entrypoint
          test "$(jq -r '.instrument' SOURCE.json)" = pulse
          grep -q "$sha" index.html PRODUCTION.md
          grep -F 'https://geogeeklab.github.io/core/observatory-entry.js' index.html
          ! grep -F 'cdn.jsdelivr.net/gh/GeoGeekLab/GeoGeekLab.github.io' index.html
          ! grep -F 'earthquake.usgs.gov/earthquakes/feed' index.html
      - name: Install browser QA
        run: |
          npm install --prefix /tmp/geogeek-pw --no-package-lock --no-save playwright@1.55.0 >/dev/null 2>&1
          /tmp/geogeek-pw/node_modules/.bin/playwright install --with-deps chromium
          cat >/tmp/audit.cjs <<'JS'
          const fs=require('fs'); const {chromium,request}=require('/tmp/geogeek-pw/node_modules/playwright');
          const [url,selector,shot,inject]=process.argv.slice(2);
          (async()=>{const b=await chromium.launch({headless:true});const p=await b.newPage({viewport:{width:1600,height:800}});if(inject==='1')await p.route(url,r=>r.fulfill({status:200,contentType:'text/html; charset=utf-8',body:fs.readFileSync('index.html','utf8')}));const res=await p.goto(url,{waitUntil:'domcontentloaded',timeout:60000});if(!res||res.status()>=400)throw Error(`navigation ${res?.status()}`);await p.waitForFunction(()=>window.GeoProviderStability?.installed&&window.GeoDataSupply?.installed,null,{timeout:45000});await p.locator(selector).first().waitFor({state:'visible',timeout:45000});if(await p.locator('.instrument-error').count())throw Error((await p.locator('.instrument-error').allTextContents()).join(' | '));const supply=await p.evaluate(()=>window.GeoDataSupply?.describe?.('usgs-earthquakes-day'));console.log('PULSE_SUPPLY='+JSON.stringify({transport:supply?.transport,stale:supply?.stale,ageLabel:supply?.ageLabel,recordCount:supply?.metadata?.recordCount}));if(!supply||supply.transport!=='same-origin-snapshot')throw Error(`unexpected USGS transport: ${JSON.stringify(supply)}`);if(shot)await p.screenshot({path:shot});const api=await request.newContext({ignoreHTTPSErrors:true});for(const href of [...new Set(await p.locator('a[href]').evaluateAll(ns=>ns.map(a=>a.href).filter(h=>/^https?:/i.test(h))))]){if(new URL(href).hostname!=='geogeeklab.github.io')continue;const r=await api.get(href,{timeout:10000,failOnStatusCode:false,maxRedirects:8});if(r.status()>=400)throw Error(`first-party link ${r.status()}: ${href}`)}await api.dispose();await b.close()})().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Capture and verify pending entry
        run: |
          mkdir -p assets
          node /tmp/audit.cjs 'https://geogeeklab.github.io/earth-pulse/?qa=pending' '.pulse-observation-lab, .pulse-layout' 'assets/instrument.png' 1
          test -s assets/instrument.png
          curl --fail --silent --show-error --location 'https://geogeeklab.github.io/data/snapshots/usgs-earthquakes-day.meta.json' -o /tmp/usgs-meta.json
          jq -e '(.fetchedAt|type=="string") and (.sha256|type=="string")' /tmp/usgs-meta.json >/dev/null
      - uses: actions/configure-pages@v5
        with: {enablement: true}
      - uses: actions/upload-pages-artifact@v4
        with: {path: .}
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed public instrument
        run: |
          url='${{ steps.deployment.outputs.page_url }}'
          curl --fail --silent --show-error --location --retry 6 --retry-all-errors --retry-delay 2 "$url" -o /tmp/public.html
          grep -q "$(jq -r '.source_commit' SOURCE.json)" /tmp/public.html
          node /tmp/audit.cjs "$url" '.pulse-observation-lab, .pulse-layout' '' 0
