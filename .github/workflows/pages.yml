name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify source lock
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          lock = json.loads(Path('SOURCE.json').read_text())
          sha = lock.get('source_commit', '')
          if lock.get('role') != 'entrypoint':
              raise SystemExit('SOURCE.json must declare role=entrypoint')
          if len(sha) != 40 or any(c not in '0123456789abcdef' for c in sha.lower()):
              raise SystemExit('SOURCE.json contains an invalid source_commit')
          for name in ('index.html', 'PRODUCTION.md'):
              if sha not in Path(name).read_text():
                  raise SystemExit(f'{name} does not reference locked source commit {sha}')
          print(f'Locked upstream: {lock["source_repository"]}@{sha}')
          PY

      - name: Refresh validated USGS snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/snapshots
          tmp="$(mktemp)"
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
            'https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson' \
            --output "$tmp"
          jq -e '.type == "FeatureCollection" and (.features | type == "array")' "$tmp" >/dev/null
          mv "$tmp" data/snapshots/usgs-earthquakes-day.geojson
          sha="$(sha256sum data/snapshots/usgs-earthquakes-day.geojson | awk '{print $1}')"
          fetched="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          jq -n --arg supplyId 'usgs-earthquakes-day' --arg fetchedAt "$fetched" --arg sha256 "$sha" \
            '{supplyId:$supplyId,fetchedAt:$fetchedAt,sha256:$sha256}' \
            > data/snapshots/usgs-earthquakes-day.meta.json

      - name: Static contract checks
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s data/snapshots/usgs-earthquakes-day.geojson
          test -s data/snapshots/usgs-earthquakes-day.meta.json
          grep -q 'GeoPulseObservationLab' index.html

      - name: Capture instrument figure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          npx --yes playwright@1.55.0 install --with-deps chromium
          python3 -m http.server 8000 >/tmp/geogeek-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8000/ >/dev/null; then
              break
            fi
            sleep 0.5
          done
          npx --yes playwright@1.55.0 screenshot \
            --viewport-size "1600,800" \
            --wait-for-timeout 15000 \
            http://127.0.0.1:8000/ assets/instrument.png
          test -s assets/instrument.png

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
