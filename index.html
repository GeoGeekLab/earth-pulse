<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07100c"><title>Earth Pulse — GeoGeek Observatory</title>
<link rel="stylesheet" data-pulse-observation-lab="1" href="https://cdn.jsdelivr.net/gh/GeoGeekLab/GeoGeekLab.github.io@d949bd75870bfd49f6d12b297e6cca02de107f9c/site/pulse-observation-lab.css">
<link rel="stylesheet" data-pulse-round4="1" href="https://cdn.jsdelivr.net/gh/GeoGeekLab/GeoGeekLab.github.io@d949bd75870bfd49f6d12b297e6cca02de107f9c/site/pulse-observation-round4.css">
<link rel="stylesheet" data-pulse-round5="1" href="https://cdn.jsdelivr.net/gh/GeoGeekLab/GeoGeekLab.github.io@d949bd75870bfd49f6d12b297e6cca02de107f9c/site/pulse-observation-round5.css">
<style>:root{--bg:#07100c;--paper:#f1efe7;--muted:rgba(241,239,231,.58);--line:rgba(241,239,231,.12);--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--sans:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--paper);font-family:var(--sans)}body{min-height:100vh;display:grid;grid-template-rows:auto 1fr auto}.top,.foot{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line);font:700 9px/1.35 var(--mono);letter-spacing:.08em}.top a{color:inherit;text-decoration:none}.top span,.foot{color:var(--muted)}main{min-height:0;padding:10px}.stage{height:calc(100vh - 92px);min-height:660px}.instrument-loading,.instrument-error{height:100%;display:grid;place-content:center;gap:10px;text-align:center;color:var(--muted)}.instrument-error strong,.instrument-loading strong{color:var(--paper)}.foot{border-top:1px solid var(--line);border-bottom:0}@media(max-width:760px){main{padding:6px}.stage{height:auto;min-height:980px}.top,.foot{padding:12px}}</style></head><body>
<header class="top"><a href="https://geogeeklab.github.io/lab.html">GEOGEEK / OBSERVATORY</a><span>VALIDATED SNAPSHOT / ROLLING 24 H</span></header>
<main><div id="instrumentStage" class="stage" aria-live="polite"><div class="instrument-loading"><strong>Loading seismic snapshot…</strong></div></div></main>
<footer class="foot"><span>GeoGeek · Geo to see. Geek to build.</span><span>USGS / EVENT ORIGIN TIME / COUNT GRID ≠ HAZARD</span></footer>
<script type="module">
const BASE='https://cdn.jsdelivr.net/gh/GeoGeekLab/GeoGeekLab.github.io@d949bd75870bfd49f6d12b297e6cca02de107f9c/site';
const stage=document.getElementById('instrumentStage');
const controller=new AbortController();
const browserFetch=window.fetch.bind(window);
window.fetch=(input,init)=>{
  try{
    const raw=typeof input==='string'||input instanceof URL?input:input?.url;
    const u=new URL(raw,location.href);
    if(u.pathname.includes('/site/data/snapshots/usgs-earthquakes-day.geojson')) return browserFetch(new URL('./data/snapshots/usgs-earthquakes-day.geojson',location.href),init);
    if(u.pathname.includes('/site/data/snapshots/usgs-earthquakes-day.meta.json')) return browserFetch(new URL('./data/snapshots/usgs-earthquakes-day.meta.json',location.href),init);
  }catch{}
  return browserFetch(input,init);
};
const loadScript=src=>new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.crossOrigin='anonymous';s.onload=resolve;s.onerror=()=>reject(new Error(`Failed to load ${src}`));document.head.appendChild(s)});
try{
  await import(`${BASE}/core/data-supply.js`);
  await loadScript(`${BASE}/pulse-observation-lab-v2.js`);
  await loadScript(`${BASE}/pulse-observation-lab-v3.js`);
  await loadScript(`${BASE}/pulse-observation-lab-v4.js`);
  const runtime=window.GeoPulseObservationLab;
  if(!runtime?.mount) throw new Error('Pulse production module did not bind.');
  await runtime.mount({stage,signal:controller.signal});
}catch(error){
  stage.innerHTML=`<div class="instrument-error"><strong>Pulse runtime unavailable.</strong><span>${String(error?.message||error)}</span></div>`;
}
addEventListener('pagehide',()=>controller.abort(),{once:true});
</script></body></html>
