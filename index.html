<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07100c"><base href="https://geogeeklab.github.io/"><title>Earth Pulse — GeoGeek Observatory</title><style>:root{--bg:#07100c;--paper:#f1efe7;--muted:rgba(241,239,231,.58);--line:rgba(241,239,231,.12);--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--sans:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--paper);font-family:var(--sans)}body{min-height:100vh;display:grid;grid-template-rows:auto 1fr auto}.top,.foot{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line);font:700 9px/1.35 var(--mono);letter-spacing:.08em}.top a{color:inherit;text-decoration:none}.top span,.foot{color:var(--muted)}main{min-height:0;padding:10px}.stage{height:calc(100vh - 92px);min-height:660px}.instrument-loading,.instrument-error{height:100%;display:grid;place-content:center;gap:10px;text-align:center;color:var(--muted)}.instrument-error strong,.instrument-loading strong{color:var(--paper)}.foot{border-top:1px solid var(--line);border-bottom:0}@media(max-width:760px){main{padding:6px}.stage{height:auto;min-height:980px}.top,.foot{padding:12px}} .pulse-tasks{display:flex;gap:5px;justify-content:center}.pulse-tasks button{border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--muted);font:700 9px/1.25 var(--mono);letter-spacing:.07em;padding:8px 11px;cursor:pointer}.pulse-tasks button[aria-pressed="true"]{color:var(--paper);border-color:rgba(209,99,57,.7);background:rgba(209,99,57,.12)}.pulse-tasks button:disabled{opacity:.35;cursor:wait}@media(max-width:760px){.top{flex-wrap:wrap}.pulse-tasks{order:3;width:100%}.stage{height:auto;min-height:980px}}</style>
<link rel="stylesheet" href="https://geogeeklab.github.io/pulse/pulse-ui-system.css?v=20261009r5">

</head><body class="instrument-dialog" data-instrument-kind="pulse">
<header class="top"><a href="https://geogeeklab.github.io/lab.html">GEOGEEK / OBSERVATORY</a><nav class="pulse-tasks" aria-label="Earth Pulse tasks"><button type="button" data-pulse-task="observe" aria-pressed="true" aria-controls="instrumentStage" disabled>OBSERVE</button><button type="button" data-pulse-task="analyze" aria-pressed="false" aria-controls="instrumentStage" disabled>ANALYZE</button></nav><span>PRODUCTION SNAPSHOT / MAIN SUPPLY</span></header>
<main><div id="instrumentStage" class="stage instrument-stage" aria-live="polite"><div class="instrument-loading"><strong>Loading seismic production runtime…</strong></div></div></main>
<footer class="foot"><span>GeoGeek · Geo to see. Geek to build.</span><span>USGS / EVENT TIME / MAGNITUDE / COUNT GRID</span></footer>
<script type="module">
const SOURCE_REVISION='12743de0f7d0e900031ec2cbbe17551255e271a5';
const ENTRY=`https://geogeeklab.github.io/core/observatory-entry.js?v=${SOURCE_REVISION}`;
const stage=document.getElementById('instrumentStage'); const controller=new AbortController(); let cleanup=null;
const taskButtons=[...document.querySelectorAll('[data-pulse-task]')];
function setTask(task){
  taskButtons.forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.pulseTask===task)));
  document.dispatchEvent(new CustomEvent('geogeek:pulse-task',{detail:{task}}));
}
taskButtons.forEach(button=>button.addEventListener('click',()=>setTask(button.dataset.pulseTask)));
try{
  // The Lab installs the Observe refinement and both Analyze workflow layers.
  // Only the analysis layer depends on the preceding workflow layer.
  for(const path of ['pulse/pulse-round6.js?v=20261009navfix1','pulse/pulse-workflow-v1.js?v=20261009navfix1','pulse/pulse-workflow-v2.js?v=20261009fixed1']){
    try { await import(`https://geogeeklab.github.io/${path}`); }
    catch(error){console.warn('[Earth Pulse] Optional Lab enhancement unavailable:',path,error);}
  }
  const runtime=await import(ENTRY);
  cleanup=await runtime.mountObservatoryInstrument('pulse',{stage,signal:controller.signal});
  stage.dataset.runtimeReady='true';
  taskButtons.forEach(button=>{button.disabled=false;});
}
catch(error){stage.innerHTML=`<div class="instrument-error"><strong>Pulse runtime unavailable.</strong><span>${String(error?.message||error)}</span></div>`;}
addEventListener('pagehide',()=>{controller.abort();try{cleanup?.()}catch{}},{once:true});
</script>
<!-- PRODUCTION 12743de0f7d0e900031ec2cbbe17551255e271a5 -->
</body></html>
